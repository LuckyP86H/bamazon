name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly: catches breakage from dependency drift even when nobody pushes.
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - name: Generated Worker types are up to date
        run: bun run cf-typegen && git diff --exit-code worker-configuration.d.ts

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run knip

      - name: Install browser for end-to-end tests
        run: bunx playwright install --with-deps chromium

      - run: bun run e2e

      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: bun audit --audit-level=high
